<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="only light" /><meta name="robots" content="noindex, nofollow" /><title>다크 모드 시험 2</title>
<style>:root{color-scheme:only light}body{margin:0;padding:10px;background:#7fd8f2;font-family:-apple-system,'Malgun Gothic',sans-serif;color:#12324a}
h1{font-size:19px;margin:2px 0 8px}.info{background:#fff;border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.5}.info b{color:#c2410c}
.l{margin:12px 0 4px;font-weight:800;font-size:15px}iframe{width:100%;height:190px;border:0;border-radius:14px;display:block;background:transparent}
.app{height:420px}</style></head><body>
<h1>다크 모드 시험 2 (비밀 모드용)</h1><div class="info" id="info">확인 중…</div>
<div class="l">A. 지금 방식</div><iframe src="a.html"></iframe>
<div class="l">B. 다크 지원 표시 + 밝은 색 유지</div><iframe src="b.html"></iframe>
<div class="l">C. light 만</div><iframe src="c.html"></iframe>
<div class="l">D. 되뒤집기 (일반 모드에선 어두운 게 정상)</div><iframe src="d.html"></iframe>
<div class="l">E. 표시 없음</div><iframe src="e.html"></iframe>
<div class="l">F. 실제 앱</div><iframe class="app" src="../?t=dt2"></iframe>
<script>
var ua=navigator.userAgent,sam=/SamsungBrowser\/([\d.]+)/.exec(ua),cr=/Chrome\/([\d.]+)/.exec(ua);
var dark=matchMedia('(prefers-color-scheme: dark)').matches;
function show(q){document.getElementById('info').innerHTML='브라우저: <b>'+(sam?'삼성 인터넷 '+sam[1]:(cr?'크롬 계열 '+cr[1]:'기타'))+'</b><br>다크 신호: <b>'+(dark?'켜짐':'꺼짐')+'</b><br>저장 한도: <b>'+q+'</b><br><span style="font-size:11px;color:#5c7486">'+ua.replace(/</g,'')+'</span>'}
show('…');
if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(function(e){show(Math.round(e.quota/1048576)+'MB')}).catch(function(){show('알 수 없음')});else show('알 수 없음');
</script></body></html>
