<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="only light" />
<meta name="robots" content="noindex, nofollow" /><title>A 지금 방식</title>
<style>
body{margin:0;background:#7fd8f2;font-family:-apple-system,'Malgun Gothic',sans-serif;color:#12324a}
.sky{height:64px;background:linear-gradient(180deg,#d4f6ff,#4cc4ea);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#0b4a75}
.pad{background:#f4fcff;padding:8px}
.card{background:#fff;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.card img{width:48px;height:48px}.card p{margin:0;font-size:15px}
.btn{margin-top:8px;height:42px;border-radius:14px;background:#8fdc45;color:#0b3c5e;font-weight:800;display:grid;place-items:center;font-size:16px}
.t{font-size:12px;padding:4px 8px;background:#fff;color:#12324a}
:root{color-scheme:only light}
</style></head><body>
<div class="sky">A 지금 방식</div><div class="pad"><div class="card"><img src="char.webp" alt="" /><p>물방울 캐릭터와 함께<br />전시를 둘러봐요.</p></div><div class="btn">다음</div></div>
<div class="t" id="t"></div>
<script>document.getElementById('t').textContent='이 칸이 받은 다크 신호: '+(matchMedia('(prefers-color-scheme: dark)').matches?'켜짐':'꺼짐')</script>
</body></html>
