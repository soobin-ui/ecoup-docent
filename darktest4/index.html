<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="only light" /><meta name="robots" content="noindex, nofollow" /><title>다크 모드 시험 4</title>
<style>:root{color-scheme:only light}body{margin:0;padding:10px;background:#7fd8f2;font-family:-apple-system,'Malgun Gothic',sans-serif;color:#12324a}
h1{font-size:19px;margin:2px 0 8px}.info{background:#fff;border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.6}.info b{color:#c2410c}
.l{margin:12px 0 4px;font-weight:800;font-size:15px}iframe{width:100%;height:185px;border:0;border-radius:14px;display:block}</style></head><body>
<h1>다크 모드 시험 4 (일반 창 + 다크 모드)</h1><div class="info" id="info"></div>
<div class="l">A. 지금 방식</div><iframe src="a.html"></iframe>
<div class="l">B. 다크 지원 표시 + 밝은 색 유지</div><iframe src="b.html"></iframe>
<div class="l">H. 삼성+다크일 때만 한 번 더 뒤집기</div><iframe src="h.html"></iframe>
<script>var sam=/SamsungBrowser\/([\d.]+)/.exec(navigator.userAgent);document.getElementById('info').innerHTML='브라우저: <b>'+(sam?'삼성 인터넷 '+sam[1]:navigator.userAgent.slice(0,50))+'</b><br>다크 신호: <b>'+(matchMedia('(prefers-color-scheme: dark)').matches?'켜짐':'꺼짐')+'</b>'</script>
</body></html>
