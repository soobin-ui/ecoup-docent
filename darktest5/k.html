<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="only light" /><meta name="robots" content="noindex, nofollow" /><title>K</title>
<style>
/* 모든 색을 정반대(보색)로 칠하고 화면 전체를 한 번 뒤집음 → 보이는 색은 원래와 같음 */
:root{color-scheme:only light}
html{filter:invert(1);background:#80270d}
img{filter:invert(1)}
body{margin:0;background:#80270d;font-family:-apple-system,'Malgun Gothic',sans-serif;color:#edcdb5}
.sky{height:60px;background:linear-gradient(180deg,#2b0900,#b33b15);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#f4b58a}
.pad{background:#0b0300;padding:8px}
.card{background:#000;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.card img{width:46px;height:46px}.card p{margin:0;font-size:15px}
.btn{margin-top:8px;height:40px;border-radius:14px;background:#7023ba;color:#f4c3a1;font-weight:800;display:grid;place-items:center;font-size:16px}
.t{font-size:12px;padding:4px 8px;background:#000;color:#edcdb5}
</style></head><body>
<div class="sky">K 보색+뒤집기</div><div class="pad"><div class="card"><img src="char.webp" alt="" /><p>물방울 캐릭터와 함께<br />전시를 둘러봐요.</p></div><div class="btn">다음</div></div>
<div class="t">다크 모드든 아니든 밝게 보이면 성공</div>
</body></html>
